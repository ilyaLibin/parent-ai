services:
  listener:
    image: parent-ai-listener:latest
    build:
      context: .
      dockerfile: packages/listener/Dockerfile
    volumes:
      - ./data:/app/data
      - ./auth_state:/app/auth_state
    env_file: .env
    restart: unless-stopped

  api:
    image: parent-ai-api:latest
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3033:3033"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      TTS_URL: http://tts:5050
      STT_URL: http://stt:8060
    depends_on:
      - tts
      - stt
    restart: unless-stopped

  telegram:
    image: parent-ai-telegram:latest
    build:
      context: .
      dockerfile: packages/telegram/Dockerfile
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  cron:
    image: parent-ai-cron:latest
    build:
      context: .
      dockerfile: packages/cron/Dockerfile
    env_file: .env
    environment:
      - TZ=Asia/Jerusalem
    depends_on:
      - api
    restart: unless-stopped

  tts:
    image: parent-ai-tts:latest
    build:
      context: .
      dockerfile: packages/tts/Dockerfile
    ports:
      - "5050:5050"
    environment:
      - TTS_API_TOKEN=${TTS_API_TOKEN}
    restart: unless-stopped

  stt:
    image: parent-ai-stt:latest
    build:
      context: .
      dockerfile: packages/stt/Dockerfile
      args:
        STT_MODEL_SIZE: ${STT_MODEL_SIZE:-small}
    ports:
      - "8060:8060"
    environment:
      - STT_API_TOKEN=${STT_API_TOKEN}
    restart: unless-stopped

  dashboard:
    image: parent-ai-dashboard:latest
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    ports:
      - "3333:3333"
    environment:
      - API_URL=http://api:3033
      - TTS_URL=http://tts:5050
      - TTS_API_TOKEN=${TTS_API_TOKEN}
    depends_on:
      - api
      - tts
    restart: unless-stopped

