services:
  listener:
    image: parent-ai-listener:latest
    build:
      context: .
      dockerfile: packages/listener/Dockerfile
    volumes:
      - ./data:/app/data
      - ./auth_state:/app/auth_state
    env_file: .env
    restart: unless-stopped

  api:
    image: parent-ai-api:latest
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3033:3033"
    volumes:
      - ./data:/app/data
    env_file: .env
    restart: unless-stopped

  telegram:
    image: parent-ai-telegram:latest
    build:
      context: .
      dockerfile: packages/telegram/Dockerfile
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  cron:
    image: parent-ai-cron:latest
    build:
      context: .
      dockerfile: packages/cron/Dockerfile
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

